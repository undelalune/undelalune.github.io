<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>undelalune</title>
<style>
  :root {
    --bg: #faf8f5;
    --fg: #1a1713;
    --muted: #6b6259;
    --accent: #c2562a;
    --line: #e5ded4;
    --card: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121011;
      --fg: #f2ece4;
      --muted: #9c9289;
      --accent: #d4703f;
      --line: #2a2522;
      --card: #1a1715;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 3rem 1.5rem 4rem;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 40rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; letter-spacing: -.02em; }
  .tagline { color: var(--muted); margin: 0 0 3rem; }
  h2 {
    font-size: .8rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: 0 0 1rem; font-weight: 600;
  }
  .app {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
  }
  .app h3 { margin: 0 0 .35rem; font-size: 1.15rem; }
  .app p { margin: 0 0 1rem; color: var(--muted); }
  .links a {
    color: var(--accent);
    text-decoration: none;
    margin-right: 1.25rem;
    font-size: .9rem;
  }
  .links a:hover { text-decoration: underline; }
  footer {
    margin-top: 3rem; padding-top: 1.5rem;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: .85rem;
  }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>undelalune</h1>
  <p class="tagline">Small Android apps, built one at a time.</p>

  <h2>Apps</h2>
  <div class="app">
    <h3>MotoRec</h3>
    <p>A voice recorder for people on the move — hands-free recording, GPS tracks,
       and on-device transcription.</p>
    <div class="links">
      <a href="https://play.google.com/store/apps/details?id=com.undelalune.motorec">Google Play</a>
      <a href="https://undelalune.github.io/legal/motorec/privacy-policy">Privacy policy</a>
      <a href="https://undelalune.github.io/legal/motorec/terms-of-service">Terms of service</a>
    </div>
  </div>

  <footer>
    Contact: <a href="mailto:undelalune-dev@outlook.com">undelalune-dev@outlook.com</a>
  </footer>
</main>
</body>
</html>
